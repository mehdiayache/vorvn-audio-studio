name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: voicestudio
          POSTGRES_USER: voicestudio
          POSTGRES_PASSWORD: voicestudio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voicestudio -d voicestudio"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://voicestudio:voicestudio@127.0.0.1:5432/voicestudio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: .venv/bin/python -m unittest discover
